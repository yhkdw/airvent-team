# Insert inside the existing nginx HTTPS 443 server block for mqtt.airvent.ai
# Never overwrite an existing nginx or Certbot configuration.
location = /v1/air-quality/stream {
  proxy_pass http://127.0.0.1:3108;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 700s;
  gzip off;
  access_log off; # URL contains an ephemeral bearer token
}
