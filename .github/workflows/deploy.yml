name: Deploy to Solana Devnet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI (Robust)
        run: |
          VERSION="v1.18.12"
          URL="https://github.com/solana-labs/solana/releases/download/${VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p ~/.local/share/solana/install
          cd ~/.local/share/solana/install
          wget --no-check-certificate --quiet --timeout=60 --tries=5 -O solana.tar.bz2 "${URL}"
          tar jxf solana.tar.bz2
          rm -rf active_release
          mv solana-release active_release
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          npm install -g @coral-xyz/anchor-cli@0.30.1
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: Setup Solana Keypair
        env:
          KEY_DATA: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.config/solana
          if [ -z "$KEY_DATA" ]; then
            echo "❌ ERROR: SOLANA_DEPLOY_KEY secret is not found or empty."
            exit 1
          fi
          echo "$KEY_DATA" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana config set --url devnet --keypair ~/.config/solana/id.json
          
          echo "💰 Requesting airdrop..."
          solana airdrop 2 || true
          echo "✅ Wallet Address: $(solana address)"
          echo "✅ Current Balance: $(solana balance)"

      - name: Build Program
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$(npm config get prefix)/bin:$PATH"
          echo "🔨 Starting Build..."
          anchor build

      - name: Deploy Program
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$(npm config get prefix)/bin:$PATH"
          echo "🚀 Starting Deployment..."
          # Use --provider.cluster instead of cluster name for clarity
          anchor deploy --provider.cluster https://api.devnet.solana.com
